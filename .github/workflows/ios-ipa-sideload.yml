# IPA iOS non firmato → da installare sul proprio iPhone con Sideloadly (Apple ID gratis).
# Non richiede Apple Developer Program (€99). Certificato free: ~7 giorni, poi ri-firma.
name: iOS IPA (Sideloadly)

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap iOS project if incomplete
        working-directory: mobile
        run: |
          set -euo pipefail
          flutter precache --ios
          flutter pub get
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create . --project-name iris_nous_mobile --org com.irisnous --platforms=ios,android
            flutter pub get
          fi
          # Assicura che CallObserverBridge resti nel target Runner (idempotente)
          if ! grep -q 'CallObserverBridge.swift' ios/Runner.xcodeproj/project.pbxproj; then
            echo "WARN: CallObserverBridge.swift non è nel pbxproj — la build potrebbe fallire"
          fi

      - name: CocoaPods
        working-directory: mobile/ios
        run: |
          pod repo update || true
          pod install

      - name: Build iOS release (no codesign)
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        working-directory: mobile
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "Runner.app non trovato. Contenuto build/ios:"
            find build/ios -maxdepth 4 -type d -print || true
            exit 1
          fi
          rm -rf build/sideload Payload
          mkdir -p build/sideload/Payload
          cp -R "$APP" build/sideload/Payload/
          (
            cd build/sideload
            zip -r -q IrisNous-unsigned.ipa Payload
          )
          ls -lh build/sideload/IrisNous-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iris-nous-ios-ipa-unsigned
          path: mobile/build/sideload/IrisNous-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
