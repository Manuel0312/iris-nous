<!DOCTYPE html>
<html lang="{{ lang|default('it') }}" data-theme="auto" data-theme-resolved="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Iris Nous" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Iris Nous — app." />
  <title>Iris Nous</title>
  <link rel="manifest" href="/static/app/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/app/icon-180.png" />
  <link rel="icon" href="/static/app/icon-192.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app/shell.css?v=irisShell514" />
  <script>
    (function () {
      try {
        var key = "iris-app-theme";
        var mode = localStorage.getItem(key) || "auto";
        var h = new Date().getHours();
        var resolved = mode === "light" || mode === "dark" ? mode : (h >= 7 && h < 20 ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", mode === "light" || mode === "dark" || mode === "auto" ? mode : "auto");
        document.documentElement.setAttribute("data-theme-resolved", resolved);
        document.documentElement.style.colorScheme = resolved;
      } catch (e) {}
    })();
  </script>
</head>
<body class="shell-body">
  {% include "_app_shell.html" %}
  <script src="/static/app/shell.js?v=irisShell514" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/app/sw.js", { scope: "/app" }).catch(function () {});
    }
  </script>
</body>
</html>
