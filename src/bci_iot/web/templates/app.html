<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#00b7ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Iris Nous" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Iris Nous — stesso sito completo anche dall’app: scopri, crea account, Ecosistema, cuffia e telefono." />
  <title>Iris Nous</title>
  <link rel="manifest" href="/static/app/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/app/icon-180.png" />
  <link rel="icon" href="/static/app/icon-192.png" type="image/png" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      background: #f5f5f7;
      overflow: hidden;
    }
    #iris-site {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f5f5f7;
    }
    .boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #f5f5f7;
      color: #00b7ff;
      font-family: system-ui, sans-serif;
      font-weight: 650;
      letter-spacing: -0.04em;
      font-size: 1.6rem;
      z-index: 2;
      transition: opacity .35s ease;
    }
    .boot.is-gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div class="boot" id="boot">Iris Nous</div>
  <!-- Stesso sito principale: registrazione, login, Ecosistema, 3D, tutto. -->
  <iframe
    id="iris-site"
    title="Iris Nous"
    src="/?from=app"
    allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"
  ></iframe>
  <script>
    (function () {
      var boot = document.getElementById("boot");
      var frame = document.getElementById("iris-site");
      function hide() {
        if (boot) boot.classList.add("is-gone");
      }
      frame.addEventListener("load", hide);
      setTimeout(hide, 1800);
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/app/sw.js", { scope: "/app" }).catch(function () {});
      }
    })();
  </script>
</body>
</html>
