<!DOCTYPE html>
<html lang="{{ lang|default('it') }}" data-theme="auto" data-theme-resolved="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>Anteprima app · Iris Nous</title>
  <link rel="icon" href="/static/app/icon-192.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app/preview.css?v=irisPrev89" />
  <link rel="stylesheet" href="/static/app/shell.css?v=irisShell89" />
  <script>
    (function () {
      try {
        var key = "iris-app-theme";
        var mode = localStorage.getItem(key) || "auto";
        var h = new Date().getHours();
        var resolved = mode === "light" || mode === "dark" ? mode : (h >= 7 && h < 20 ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", mode === "light" || mode === "dark" || mode === "auto" ? mode : "auto");
        document.documentElement.setAttribute("data-theme-resolved", resolved);
        document.documentElement.style.colorScheme = resolved;
      } catch (e) {}
    })();
  </script>
</head>
<body class="preview-body">
  <header class="preview-top">
    <div>
      <p class="eyebrow">Anteprima</p>
      <h1>Come sarà l’app</h1>
    </div>
    <div class="preview-top-actions">
      <a class="btn ghost" href="/">Sito</a>
      <a class="btn" href="/app/installa">Come installarla</a>
    </div>
  </header>

  <main class="preview-stage">
    <div class="phone" role="application" aria-label="Anteprima Iris Nous">
      <div class="phone-notch" aria-hidden="true"></div>
      <div class="phone-screen phone-screen-shell">
        {% include "_app_shell.html" %}
      </div>
      <div class="phone-home" aria-hidden="true"></div>
    </div>
  </main>

  <p class="preview-foot">
    Anteprima nel browser ·
    <a href="/app">Apri l’app a schermo intero</a> ·
    <a href="/app/device">Collega il telefono</a>
  </p>

  <script src="/static/app/shell.js?v=irisShell89" defer></script>
</body>
</html>
